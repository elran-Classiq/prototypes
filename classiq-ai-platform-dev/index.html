<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Classiq AI — Protected preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --background:#171717; --foreground:#fafafa;
  --card:#1e1e1e; --muted-foreground:#a3a3a3;
  --primary:#d7f75b; --primary-foreground:#171717;
  --border:#2f2f2f; --border-strong:#646464; --ring:#646464;
  --destructive:#ff6467;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--background); color:var(--foreground);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  display:flex; align-items:center; justify-content:center; padding:24px;
}
/* subtle triangulated backdrop echo */
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(215,247,91,.05), transparent 60%),
    radial-gradient(900px 500px at 100% 110%, rgba(91,224,230,.045), transparent 60%);
}
.card{
  position:relative; z-index:1; width:100%; max-width:380px;
  background:var(--card); border:1px solid var(--border); border-radius:16px;
  padding:32px 28px 28px; box-shadow:0 24px 60px rgba(0,0,0,.45);
}
.brand{display:flex; align-items:center; gap:10px; margin-bottom:22px}
.brand svg{height:20px; width:auto; display:block}
.lock{
  width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
  background:rgba(215,247,91,.10); border:1px solid rgba(215,247,91,.28); color:var(--primary);
  margin-bottom:16px;
}
h1{font-size:19px; font-weight:600; letter-spacing:-.01em; margin:0 0 6px}
.sub{color:var(--muted-foreground); margin:0 0 22px}
label{display:block; font-size:12.5px; font-weight:500; color:var(--muted-foreground); margin:0 0 7px}
.field{position:relative}
input[type=password],input[type=text]{
  width:100%; height:44px; padding:0 44px 0 14px; font-size:14.5px; color:var(--foreground);
  background:#141414; border:1px solid var(--border); border-radius:10px; outline:none;
  transition:border-color .15s ease, box-shadow .15s ease;
  font-family:inherit;
}
input:focus{border-color:var(--border-strong); box-shadow:0 0 0 3px rgba(100,100,100,.28)}
.reveal{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  height:32px; width:32px; display:flex; align-items:center; justify-content:center;
  background:none; border:0; color:var(--muted-foreground); cursor:pointer; border-radius:8px;
}
.reveal:hover{color:var(--foreground); background:rgba(255,255,255,.05)}
.reveal:focus-visible{outline:2px solid var(--ring); outline-offset:2px}
button.submit{
  margin-top:16px; width:100%; height:44px; font-size:14.5px; font-weight:600; cursor:pointer;
  color:var(--primary-foreground); background:var(--primary); border:0; border-radius:10px;
  font-family:inherit; transition:filter .15s ease, transform .05s ease;
}
button.submit:hover{filter:brightness(1.06)}
button.submit:active{transform:translateY(1px)}
button.submit:focus-visible{outline:2px solid var(--primary); outline-offset:2px}
.error{
  display:none; align-items:center; gap:7px; margin-top:12px;
  color:var(--destructive); font-size:13px;
}
.error.show{display:flex}
.foot{margin-top:22px; color:var(--muted-foreground); font-size:12px; text-align:center}
.shake{animation:shake .32s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-4px)}40%,60%{transform:translateX(4px)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand" aria-label="Classiq">
      <!-- Classiq wordmark (inline, matches prototype) -->
      <svg viewBox="0 0 120 22" aria-hidden="true" focusable="false">
        <text x="0" y="17" font-family="Inter, sans-serif" font-size="18" font-weight="700" letter-spacing="1.5" fill="#d7f75b">CLASSIQ</text>
      </svg>
    </div>
    <div class="lock" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Protected preview</h1>
    <p class="sub">This prototype is shared privately. Enter the password to continue.</p>

    <form id="gate" autocomplete="off" novalidate>
      <label for="pw">Password</label>
      <div class="field">
        <input id="pw" name="pw" type="password" autocomplete="off" autofocus
               aria-describedby="err" aria-invalid="false" placeholder="••••••••" />
        <button type="button" class="reveal" id="reveal" aria-label="Show password" aria-pressed="false">
          <svg id="eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <button type="submit" class="submit">Enter</button>
      <div class="error" id="err" role="alert">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Incorrect password. Try again.</span>
      </div>
    </form>

    <div class="foot">Classiq Engineer · design preview</div>
  </main>

<script>
(function(){
  var PASS = "showme";
  var form = document.getElementById("gate");
  var input = document.getElementById("pw");
  var err = document.getElementById("err");
  var card = document.querySelector(".card");
  var reveal = document.getElementById("reveal");

  // if already unlocked this session, go straight in
  try { if (sessionStorage.getItem("cq_unlocked") === "1") location.replace("./app.html"); } catch(e){}

  reveal.addEventListener("click", function(){
    var showing = input.type === "text";
    input.type = showing ? "password" : "text";
    reveal.setAttribute("aria-pressed", String(!showing));
    reveal.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    input.focus();
  });

  form.addEventListener("submit", function(e){
    e.preventDefault();
    var val = (input.value || "").trim();
    if (val.toLowerCase() === PASS) {
      try { sessionStorage.setItem("cq_unlocked", "1"); sessionStorage.setItem("cq_intro", "1"); } catch(_){}
      location.replace("./app.html");
      return;
    }
    err.classList.add("show");
    input.setAttribute("aria-invalid", "true");
    card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
    input.select();
  });

  input.addEventListener("input", function(){
    if (err.classList.contains("show")) {
      err.classList.remove("show");
      input.setAttribute("aria-invalid", "false");
    }
  });
})();
</script>
</body>
</html>
