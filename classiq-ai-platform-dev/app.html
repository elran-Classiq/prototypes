<meta charset="utf-8" />

<title>Classiq AI — Agentic Platform (shadcn build)</title>

<script src="./react-dom.min.js"></script>

<style>
/* ============================================================
   Classiq shadcn/ui token layer  (brain/design-system/tokens.md)
   Semantic names map 1:1 to shadcn/ui. Dark is default; light is
   first-class. Primary is mode-aware: black on light, lime on dark.
   ============================================================ */
:root, .dark {
  --background:#171717; --foreground:#fafafa;
  --card:#1e1e1e; --card-foreground:#fafafa;
  --popover:#1e1e1e; --popover-foreground:#fafafa;
  --primary:#d7f75b; --primary-foreground:#171717;
  --secondary:#262626; --secondary-foreground:#fafafa;
  --muted:#262626; --muted-foreground:#a3a3a3;
  --accent:#262626; --accent-foreground:#fafafa;
  --destructive:#ff6467; --destructive-foreground:#ffffff;
  --border:#2f2f2f; --border-strong:#646464; --input:#2f2f2f;
  --ring:#646464;
  /* app surfaces (shadcn --sidebar family) */
  --sidebar:#0c0c0d; --sidebar-foreground:#e6e6e6; --sidebar-border:#1f1f22;
  --canvas:#0e0e10;
  --grad-a:#d7f75b; --grad-b:#5be0e6; --grad-c:#9b7cff;
  color-scheme: dark;
}
.light {
  --background:#ffffff; --foreground:#0a0a0a;
  --card:#ffffff; --card-foreground:#0a0a0a;
  --popover:#ffffff; --popover-foreground:#0a0a0a;
  --primary:#171717; --primary-foreground:#fafafa;
  --secondary:#f5f5f5; --secondary-foreground:#171717;
  --muted:#f5f5f5; --muted-foreground:#737373;
  --accent:#e8e8e8; --accent-foreground:#171717;   /* visible light-grey hover/active */
  --destructive:#e7000b; --destructive-foreground:#ffffff;
  --border:#e5e5e5; --border-strong:#d4d4d4; --input:#e5e5e5;
  --ring:#a1a1a1;
  --sidebar:#fafafa; --sidebar-foreground:#171717; --sidebar-border:#ececec;
  --canvas:#f7f7f8;
  color-scheme: light;
}

*{box-sizing:border-box}
html,body,#root{height:100%}
body{
  margin:0; background:var(--background); color:var(--foreground);
  font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace}
button{font-family:inherit}
::selection{background:color-mix(in srgb,var(--primary) 30%,transparent)}

/* focus visibility — never color alone */
:focus-visible{outline:2px solid var(--ring); outline-offset:2px; border-radius:8px}

/* ---------- shadcn primitives ---------- */
/* Button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  height:36px;padding:0 16px;border-radius:8px;border:1px solid transparent;
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background .14s ease,border-color .14s ease,color .14s ease,opacity .14s;
  background:transparent;color:var(--foreground)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:color-mix(in srgb,var(--primary) 90%,#000)}
.btn-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.btn-secondary:hover{background:color-mix(in srgb,var(--secondary) 80%,var(--foreground) 6%)}
.btn-outline{border-color:var(--border);background:transparent}
.btn-outline:hover{background:var(--accent)}
.btn-ghost:hover{background:var(--accent)}
.btn-sm{height:30px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-icon{width:34px;height:34px;padding:0;border-radius:8px}
.btn-icon.btn-sm{width:30px;height:30px}

/* Badge */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;
  border-radius:9999px;font-size:12px;font-weight:500;line-height:1;border:1px solid transparent}
.badge-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge-outline{border-color:var(--border);color:var(--muted-foreground)}
.badge-success{background:color-mix(in srgb,#22c55e 18%,transparent);color:#7ee2a8;border-color:color-mix(in srgb,#22c55e 30%,transparent)}
.light .badge-success{color:#15803d}

/* Avatar */
.avatar{width:32px;height:32px;border-radius:9999px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:linear-gradient(135deg,var(--grad-c),var(--grad-b));
  color:#0b0b0d;font-weight:600;font-size:12px}

/* Separator */
.sep{background:var(--border);border:0;flex:0 0 auto}
.sep-h{height:1px;width:100%;margin:0}
.sep-v{width:1px;align-self:stretch}

/* Tooltip */
.tt{position:relative;display:inline-flex}
.tt>.tt-body{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);
  padding:5px 9px;border-radius:8px;font-size:12px;white-space:nowrap;pointer-events:none;
  opacity:0;transition:opacity .12s ease,transform .12s ease;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:60}
.tt:hover>.tt-body,.tt:focus-within>.tt-body{opacity:1;transform:translateX(-50%) translateY(0)}

/* Item (list row / artifact card) */
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;
  border:1px solid transparent;cursor:pointer;transition:background .12s,border-color .12s;color:inherit;
  width:100%;text-align:left;background:transparent}
.item:hover{background:var(--accent)}
.item.selected{background:var(--accent);border-color:var(--border)}
.item.card{border-color:var(--border);background:var(--card);cursor:default}
.item .item-media{width:32px;height:32px;border-radius:8px;flex:0 0 auto;display:flex;
  align-items:center;justify-content:center;background:var(--secondary);color:var(--muted-foreground)}
.item .item-content{min-width:0;flex:1}
.item .item-title{font-size:13.5px;font-weight:500;color:var(--foreground);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .item-desc{font-size:12px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .item-actions{display:flex;align-items:center;gap:2px;flex:0 0 auto}

/* Kbd */
.kbd{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:6px;
  border:1px solid var(--border);background:var(--secondary);color:var(--muted-foreground);
  font-family:'JetBrains Mono',monospace;font-size:11px;line-height:1}

/* Spinner */
.spinner{width:16px;height:16px;border-radius:9999px;border:2px solid color-mix(in srgb,var(--foreground) 20%,transparent);
  border-top-color:var(--foreground);animation:spin .7s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* Dropdown */
.menu{position:absolute;min-width:220px;background:var(--popover);color:var(--popover-foreground);
  border:1px solid var(--border);border-radius:12px;padding:6px;z-index:70;
  box-shadow:0 12px 32px rgba(0,0,0,.45)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:8px;
  font-size:13.5px;cursor:pointer;background:transparent;border:0;color:inherit;text-align:left}
.menu-item:hover{background:var(--accent)}
.menu-label{padding:6px 10px 4px;font-size:11px;color:var(--muted-foreground);text-transform:uppercase;letter-spacing:.06em}

/* ---------- app shell ---------- */
.app{display:flex;height:100%;overflow:hidden}
.sidebar{width:255px;flex:0 0 auto;background:var(--sidebar);color:var(--sidebar-foreground);
  border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;
  transition:width .22s cubic-bezier(.2,0,0,1);overflow:hidden}
.sidebar.rail{width:52px}
.rail .sb-head{padding:0;justify-content:center}
.rail .railbtn{width:36px;height:36px}
.app.hidenav .sidebar{width:0;border-right-color:transparent}
.sb-head{display:flex;align-items:center;justify-content:space-between;gap:8px;height:64px;flex:0 0 auto;padding:0 16px}
.logo{display:flex;align-items:center;height:20px}
.logo img{height:13px;width:auto;display:block}
/* light mode: render the Classiq logo black; dark keeps the original lime */
.light .logo img{filter:brightness(0)}
.rail .logo{justify-content:center}
.rail .logo img{height:16px}
.sb-newbtn{padding:8px}
.rail .sb-newbtn{display:flex;justify-content:center}
.sb-scroll{flex:1;overflow-y:auto;padding:0 8px}
.sb-section{font-size:12px;color:var(--muted-foreground);letter-spacing:.01em;padding:14px 8px 6px}
.sb-foot{padding:8px;border-top:1px solid var(--sidebar-border)}
.rail .sb-foot{display:flex;justify-content:center}
/* menu rows — Figma: 32px tall, 8px pad, icon 16 @ x8, text @ x32 */
.mrow{display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border-radius:8px;
  font-size:14px;color:var(--sidebar-foreground);cursor:pointer;background:transparent;border:0;text-align:left;
  text-decoration:none;transition:background .12s}
.mrow:hover{background:var(--accent)}
.mrow.active{background:var(--accent)}
.mrow .mlabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .mdot{width:6px;height:6px;border-radius:9999px;background:var(--primary);flex:0 0 auto}
.mrow .ext{color:var(--muted-foreground);flex:0 0 auto}
.mrow .mico{flex:0 0 auto;color:var(--sidebar-foreground);display:flex}
.mrow.muted,.mrow.muted .mico{color:var(--muted-foreground)}
.railbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  background:transparent;border:0;color:var(--sidebar-foreground);cursor:pointer;transition:background .12s}
.railbtn:hover{background:var(--accent)}
.profile{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;cursor:pointer;width:100%;background:transparent;border:0;color:inherit;text-align:left}
.profile:hover{background:var(--accent)}
.profile .who{min-width:0;flex:1}
.profile .nm{font-size:14px;font-weight:600;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile .co{font-size:12px;color:var(--muted-foreground)}
.avatar-img{width:32px;height:32px;border-radius:9999px;object-fit:cover;flex:0 0 auto}

/* workspace */
.workspace{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--background)}
.topbar{height:52px;flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted-foreground)}
.crumb .cur{color:var(--foreground);font-weight:500}
.topbar .grow{flex:1}

/* split */
.split{flex:1;min-height:0;display:flex;position:relative}
.split.resizing{cursor:col-resize;user-select:none}
.split.resizing *{pointer-events:none}
.chat{flex:0 0 auto;min-width:0;display:flex;flex-direction:column;position:relative}
/* barely-visible organic triangular mesh behind the chat (jittered wireframe) */
.chat::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:url("./assets/mesh.svg");background-size:cover;background-position:top left;background-repeat:no-repeat}
.dark .chat::before{opacity:.12}
.light .chat::before{opacity:.16}
.chat>*{position:relative;z-index:1}
.split.nocanvas .chat{flex:1 1 auto !important}
/* chat header (only with canvas open) — carries the collapse toggle */
.chat-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:48px;padding:0 8px 0 16px;border-bottom:1px solid var(--border)}
.chat-head .grow{flex:1}
.chat-head-title{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:500;color:var(--foreground)}
.chat-head-title>svg{color:var(--muted-foreground)}
/* collapsed chat → vertical rail to bring it back */
.chat-expand-rail{flex:0 0 auto;width:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border:0;border-right:1px solid var(--border);background:var(--background);color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s}
.chat-expand-rail:hover{background:var(--accent);color:var(--foreground)}
.canvas{flex:1 1 0;min-width:0;background:var(--canvas);border-left:1px solid var(--border);display:flex;flex-direction:column}

/* resizer */
.resizer{flex:0 0 auto;width:10px;margin:0 -5px;position:relative;z-index:20;cursor:col-resize;
  display:flex;align-items:center;justify-content:center;background:transparent}
.resizer::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border);transition:background .12s}
.resizer:hover::before,.resizer:focus-visible::before,.split.resizing .resizer::before{background:var(--primary)}
.resizer .grip{width:6px;height:34px;border-radius:9999px;background:var(--border-strong);opacity:0;transition:opacity .12s;z-index:1}
.resizer:hover .grip,.resizer:focus-visible .grip{opacity:1}
.resizer:focus-visible{outline:none}

/* chat body */
.chat-scroll{flex:1;overflow-y:auto;padding:22px 0 8px}
/* auto-hiding scrollbars — thumb reveals only on container hover */
.chat-scroll,.canvas-body,.sb-scroll,.vpane-body,.drawer-body{scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .18s ease}
.chat-scroll:hover,.canvas-body:hover,.sb-scroll:hover,.vpane-body:hover,.drawer-body:hover,
.chat-scroll:focus-within,.canvas-body:focus-within,.sb-scroll:focus-within,.vpane-body:focus-within,.drawer-body:focus-within{scrollbar-color:var(--border-strong) transparent}
.chat-scroll::-webkit-scrollbar,.canvas-body::-webkit-scrollbar,.sb-scroll::-webkit-scrollbar,.vpane-body::-webkit-scrollbar,.drawer-body::-webkit-scrollbar{width:10px;height:10px}
.chat-scroll::-webkit-scrollbar-track,.canvas-body::-webkit-scrollbar-track,.sb-scroll::-webkit-scrollbar-track,.vpane-body::-webkit-scrollbar-track,.drawer-body::-webkit-scrollbar-track{background:transparent}
.chat-scroll::-webkit-scrollbar-thumb,.canvas-body::-webkit-scrollbar-thumb,.sb-scroll::-webkit-scrollbar-thumb,.vpane-body::-webkit-scrollbar-thumb,.drawer-body::-webkit-scrollbar-thumb{
  background:transparent;border:3px solid transparent;background-clip:content-box;border-radius:9999px;transition:background-color .18s ease}
.chat-scroll:hover::-webkit-scrollbar-thumb,.canvas-body:hover::-webkit-scrollbar-thumb,.sb-scroll:hover::-webkit-scrollbar-thumb,.vpane-body:hover::-webkit-scrollbar-thumb,.drawer-body:hover::-webkit-scrollbar-thumb,
.chat-scroll:focus-within::-webkit-scrollbar-thumb,.canvas-body:focus-within::-webkit-scrollbar-thumb,.sb-scroll:focus-within::-webkit-scrollbar-thumb,.vpane-body:focus-within::-webkit-scrollbar-thumb,.drawer-body:focus-within::-webkit-scrollbar-thumb{background:var(--border-strong);background-clip:content-box}
/* same hover-only scrollbars for the fullscreen result page + jobs list */
.fs-stage,.rfull-main,.jh-list{scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color .18s ease}
.fs-stage:hover,.rfull-main:hover,.jh-list:hover,
.fs-stage:focus-within,.rfull-main:focus-within,.jh-list:focus-within{scrollbar-color:var(--border-strong) transparent}
.fs-stage::-webkit-scrollbar,.rfull-main::-webkit-scrollbar,.jh-list::-webkit-scrollbar{width:10px;height:10px}
.fs-stage::-webkit-scrollbar-track,.rfull-main::-webkit-scrollbar-track,.jh-list::-webkit-scrollbar-track{background:transparent}
.fs-stage::-webkit-scrollbar-thumb,.rfull-main::-webkit-scrollbar-thumb,.jh-list::-webkit-scrollbar-thumb{
  background:transparent;border:3px solid transparent;background-clip:content-box;border-radius:9999px;transition:background-color .18s ease}
.fs-stage:hover::-webkit-scrollbar-thumb,.rfull-main:hover::-webkit-scrollbar-thumb,.jh-list:hover::-webkit-scrollbar-thumb,
.fs-stage:focus-within::-webkit-scrollbar-thumb,.rfull-main:focus-within::-webkit-scrollbar-thumb,.jh-list:focus-within::-webkit-scrollbar-thumb{background:var(--border-strong);background-clip:content-box}
.chat-inner{max-width:720px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:18px}
/* shadcn AI chat: lime user bubble (right), assistant avatar + content (left) */
.msg-user{align-self:flex-end;max-width:82%;color:#ffffff;background:#784EFF;
  padding:9px 14px;border-radius:16px;border-bottom-right-radius:6px;font-size:14px;font-weight:500}
.ai-row{align-self:stretch;display:flex;gap:10px;align-items:flex-start}
/* smooth message entrance */
@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.msg-user,.ai-row{animation:msgIn .34s cubic-bezier(.2,0,0,1) both}
.ai-row .ai-avatar{animation:msgIn .34s cubic-bezier(.2,0,0,1) both;animation-delay:.04s}
.ai-avatar{width:28px;height:28px;border-radius:9999px;flex:0 0 auto;margin-top:2px;
  display:flex;align-items:center;justify-content:center;background:var(--secondary);color:var(--primary);
  border:1px solid var(--border)}
.ai-body{min-width:0;flex:1}
.msg-ai{font-size:14.5px;line-height:1.62;color:var(--foreground)}
.msg-ai h3{font-size:16px;font-weight:600;margin:6px 0 6px;display:flex;align-items:center;gap:8px}
.msg-ai p{margin:0 0 10px}
.msg-ai .lead{color:var(--muted-foreground)}
.msg-ai code{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:var(--secondary);
  padding:1.5px 6px;border-radius:6px;color:var(--foreground)}
.tool-call{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-foreground);cursor:pointer;
  background:transparent;border:0;padding:2px 0}
.tool-call:hover{color:var(--foreground)}
.reason{border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden}
.reason>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;gap:8px;
  font-size:13px;color:var(--muted-foreground)}
.reason>summary::-webkit-details-marker{display:none}
.reason[open]>summary{border-bottom:1px solid var(--border);color:var(--foreground)}
.reason .rbody{padding:10px 12px;font-size:13px;color:var(--muted-foreground);line-height:1.6}
.status{display:flex;align-items:center;gap:8px;font-size:13.5px}
.eqn{font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--foreground);overflow-x:auto}

/* greeting (empty) — composer centered, chips beneath */
.greeting{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px}
.greeting h1{font-size:28px;font-weight:600;margin:0 0 4px;text-align:center;
  min-height:40px;display:flex;align-items:center;justify-content:center}
.greeting h1.rotating{opacity:0;transform:translateY(6px);transition:opacity .42s ease,transform .42s ease}
.greeting h1.rotating.in{opacity:1;transform:none}
.greeting .composer-wrap.centered{padding:0;width:100%;max-width:680px}
.greeting .composer-wrap.centered .composer-inner{max-width:none}

/* composer */
.composer-wrap{flex:0 0 auto;padding:14px 24px 20px}
.composer-inner{max-width:720px;margin:0 auto}
.composer{position:relative;border-radius:16px;background:var(--card);border:1px solid var(--border);
  padding:2px;transition:border-color .15s}
.composer.grad::before{content:"";position:absolute;inset:-1px;border-radius:17px;padding:1px;
  background:conic-gradient(from var(--a,0deg),#8b5cff,#5b8cff,#a9e7ff,#5b8cff,#8b5cff);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .2s}
.composer.grad.on::before{opacity:1;animation:spin-grad 5s linear infinite}
@keyframes spin-grad{to{--a:360deg}}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
.composer-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;position:relative;background:var(--card);border-radius:15px}
.send-btn{border-radius:9999px}
.composer textarea{flex:1;border:0;background:transparent;resize:none;color:var(--foreground);font:inherit;
  font-size:14.5px;line-height:1.5;padding:7px 2px;max-height:160px;outline:none}
.composer textarea::placeholder{color:var(--muted-foreground)}

/* canvas */
/* single header row (replaces tabs + toolbar) */
.canvas-head{flex:0 0 auto;display:flex;align-items:center;gap:6px;height:48px;padding:0 8px 0 12px;border-bottom:1px solid var(--border)}
.canvas-head .grow{flex:1}
.canvas-head-title{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;color:var(--foreground)}
.canvas-head .count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 6px;
  border-radius:9999px;background:var(--secondary);color:var(--muted-foreground);font-size:12px;line-height:1}
.canvas-head-cur{font-size:13.5px;font-weight:500;color:var(--foreground);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb-sep{color:var(--muted-foreground);font-size:13px}
.back-btn{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 8px 0 6px;border-radius:8px;flex:0 0 auto;
  background:transparent;border:0;color:var(--muted-foreground);font:inherit;font-size:13px;cursor:pointer;
  transition:background .12s,color .12s}
.back-btn:hover{background:var(--accent);color:var(--foreground)}
.head-sep{width:1px;height:20px;background:var(--border);flex:0 0 auto;margin:0 2px}
/* artifact list (Claude-style: created artifacts collect here) */
.artifact-list{padding:10px;display:flex;flex-direction:column;gap:4px}
.artifact-list .item .ext{color:var(--muted-foreground);display:flex;flex:0 0 auto}
.artifact-list .item .item-actions .btn{opacity:0;transition:opacity .12s}
.artifact-list .item:hover .item-actions .btn,.artifact-list .item:focus-within .item-actions .btn{opacity:1}
/* artifact switcher — action sheet that pops on click */
.switch-trigger{display:inline-flex;align-items:center;gap:8px;height:32px;max-width:320px;padding:0 8px;border-radius:8px;
  background:transparent;border:0;color:var(--foreground);font:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s}
.switch-trigger:hover{background:var(--accent)}
.switch-trigger>svg:first-child{color:var(--muted-foreground);flex:0 0 auto}
.switch-trigger-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.switcher-pop{position:absolute;top:calc(100% + 8px);left:0;z-index:70;width:min(400px,88vw);overflow:visible;
  background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:16px;padding:12px;
  box-shadow:0 16px 40px rgba(0,0,0,.45);animation:msgIn .16s cubic-bezier(.2,0,0,1) both}
.switcher-head{display:flex;align-items:center;gap:8px;padding:2px 4px 10px}
.switcher-head .art-h-title{flex:1;font-size:16px;font-weight:600;color:var(--foreground)}
.art-dl{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 8px;border-radius:8px;border:0;background:transparent;
  color:var(--muted-foreground);font:inherit;font-size:13.5px;cursor:pointer;transition:background .12s,color .12s}
.art-dl:hover{background:var(--accent);color:var(--foreground)}
.switcher-list{display:flex;flex-direction:column;gap:7px}
.art-row{position:relative;display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;
  border:1px solid transparent;background:transparent;color:var(--foreground);cursor:pointer;
  transition:border-color .14s,background .14s,box-shadow .14s}
.art-row:hover{background:var(--accent)}
.art-row.active{border-color:var(--border-strong);box-shadow:0 0 0 1px var(--border-strong)}
.art-thumb{flex:0 0 auto;width:40px;height:44px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  color:var(--muted-foreground);border:1px solid var(--border);
  background:linear-gradient(155deg,var(--secondary),color-mix(in srgb,var(--secondary) 45%,var(--background)))}
.art-row.active .art-thumb{color:var(--foreground);border-color:var(--border-strong)}
.art-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.art-title{font-size:15px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-rename{font-size:15px;font-weight:600;line-height:1.2;color:var(--foreground);background:var(--secondary);
  border:1px solid var(--border-strong);border-radius:6px;padding:2px 6px;width:100%;outline:none;font-family:inherit}
.art-rename:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
.art-row.editing{background:var(--accent);border-color:var(--border)}
.art-sub{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted-foreground);min-width:0}
.art-sub-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.art-panes{flex:0 0 auto;display:inline-flex;align-items:center;gap:3px;padding:0 6px;height:17px;border-radius:999px;
  font-size:11px;font-weight:600;line-height:1;color:var(--muted-foreground);
  background:var(--secondary);border:1px solid var(--border)}
.art-panes svg{opacity:.75}
.art-row.active .art-panes{color:var(--foreground);border-color:var(--border-strong)}
.art-actions{flex:0 0 auto;display:flex;align-items:center;gap:2px}
.art-actions .art-x{opacity:0;transition:opacity .12s}
.art-row:hover .art-x,.art-row:focus-within .art-x{opacity:1}

/* profile settings dialog (recomposed — Dialog not in kit) */
.modal-scrim{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;padding:24px;
  background:rgba(15,15,17,.66);animation:scrimIn .16s ease both}
.light .modal-scrim{background:rgba(38,38,38,.32)}
@keyframes scrimIn{from{opacity:0}to{opacity:1}}
.dialog{width:740px;max-width:100%;max-height:calc(100vh - 48px);overflow-y:auto;display:flex;flex-direction:column;gap:16px;
  background:var(--background);color:var(--foreground);border:1px solid var(--border);border-radius:12px;padding:24px;
  box-shadow:0 10px 15px -3px rgba(0,0,0,.2),0 4px 6px -4px rgba(0,0,0,.2);animation:dialogIn .18s cubic-bezier(.2,0,0,1) both}
.light .dialog{box-shadow:0 10px 30px rgba(15,23,42,.14),0 4px 6px -4px rgba(15,23,42,.1)}
@keyframes dialogIn{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.dialog-head{display:flex;flex-direction:column;gap:6px}
.dialog-titlerow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.dialog-title{margin:0;font-size:18px;font-weight:600;line-height:1.5}
.dialog-desc{margin:0;font-size:14px;line-height:1.45;color:var(--muted-foreground)}
.userinfo{display:flex;gap:48px;align-items:flex-start}
.userinfo-ava{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.avatar-lg{width:100px;height:100px;border-radius:9999px;font-size:34px}
.avatar-edit{background:transparent;border:0;cursor:pointer;font:inherit;font-size:14px;color:var(--muted-foreground);transition:color .12s}
.avatar-edit:hover{color:var(--foreground)}
.fields{flex:1;min-width:0;display:flex;flex-direction:column;gap:16px}
.field-row{display:flex;align-items:center;gap:12px}
.field-label{flex:0 0 140px;font-size:14px;font-weight:500;color:var(--card-foreground)}
.input{display:block;width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--input);
  background:var(--background);color:var(--foreground);font:inherit;font-size:14px;box-shadow:0 1px 2px rgba(0,0,0,.06);
  outline:none;transition:border-color .12s,box-shadow .12s}
.input:focus{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
.input::placeholder{color:var(--muted-foreground)}
.input.plain{border-color:transparent;background:transparent;box-shadow:none;padding-left:2px}
.field-row .input{flex:1 1 0;min-width:0;width:auto}   /* profile modal: fill next to the label */
.terms-title{margin:0 0 8px;font-size:14px;font-weight:500;color:var(--card-foreground)}
.terms-body{margin:0;font-size:14px;font-weight:300;line-height:1.5;color:var(--muted-foreground)}
.btn-destructive-outline{border:1px solid var(--destructive);color:var(--destructive);background:transparent;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.btn-destructive-outline:hover{background:color-mix(in srgb,var(--destructive) 12%,transparent)}
.btn-destructive{background:var(--destructive);color:var(--destructive-foreground)}
.btn-destructive:hover{background:color-mix(in srgb,var(--destructive) 88%,#000)}
/* confirmation alert dialog */
.dialog-sm{width:440px;gap:20px}
.dialog-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px}
@media(max-width:640px){.userinfo{flex-direction:column;gap:20px;align-items:center}.field-label{flex-basis:110px}}

/* jobs dashboard (Run artifact) */
.jobs{padding:22px 24px 30px;display:flex;flex-direction:column;gap:18px;min-height:100%}
.jobs-title{margin:0;font-size:22px;font-weight:600}
.jobs-sub{margin:4px 0 0;font-size:13.5px;color:var(--muted-foreground)}
.jobs-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:900px){.jobs-cards{grid-template-columns:1fr}}
.jcard{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:18px 20px;
  display:flex;flex-direction:column;gap:12px;animation:cardIn .5s cubic-bezier(.2,0,0,1) both}
.jcard:nth-child(2){animation-delay:.08s}
.jcard-title{font-size:15px;font-weight:600}
.jcard-sub{font-size:12.5px;color:var(--muted-foreground);margin-top:-8px}
.jcard-chart{flex:1;display:flex;align-items:center;justify-content:center;min-height:210px}
.jcard-foot{font-size:13px;color:var(--foreground)}
.jcard-foot .muted{color:var(--muted-foreground)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.donut{transform-origin:center;animation:donutIn .5s cubic-bezier(.2,0,0,1) both}
@keyframes donutIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.donut-slice{animation:sliceIn .55s ease both;transition:opacity .15s}
.donut-slice:hover{opacity:.82}
@keyframes sliceIn{from{opacity:0}to{opacity:1}}
.donut-label{fill:var(--muted-foreground);font-size:12px;font-family:'JetBrains Mono',monospace}
.bar{fill:#2bb6bf;transform-box:fill-box;transform-origin:bottom;animation:barGrow .6s cubic-bezier(.2,0,0,1) both;transition:fill .15s}
.bar:hover{fill:#5be0e6}
@keyframes barGrow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.bar-grid{stroke:var(--border);stroke-width:1}
.bar-x{fill:var(--muted-foreground);font-size:12px}
/* line chart (execution results) */
.jchart{display:flex;flex-direction:column;gap:12px;padding:2px}
.jchart-plot{width:100%}
.jchart-cap-title{margin:4px 0 2px;font-size:14px;font-weight:600;color:var(--foreground)}
.jchart-cap{margin:0;font-size:13px;line-height:1.5;color:var(--muted-foreground);max-width:760px}
.line-path{fill:none;stroke:#2ec9d6;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1 1;stroke-dashoffset:1;animation:lineDraw 1.1s cubic-bezier(.2,0,0,1) .1s forwards}
@keyframes lineDraw{to{stroke-dashoffset:0}}
.line-dot{fill:var(--canvas);stroke:#2ec9d6;stroke-width:2.5;opacity:0;animation:dotIn .3s ease forwards;transition:stroke .15s}
.line-dot:hover{stroke:#5be0e6}
@keyframes dotIn{to{opacity:1}}
/* combined results report */
.results{display:flex;flex-direction:column;gap:20px;padding:20px 22px 28px;min-height:100%}
.res-section{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);
  animation:cardIn .5s cubic-bezier(.2,0,0,1) both}
.res-section:nth-child(2){animation-delay:.07s}
.res-section:nth-child(3){animation-delay:.14s}
.res-head{display:flex;align-items:center;gap:9px;padding:11px 15px;border-bottom:1px solid var(--border);
  background:var(--secondary);color:var(--muted-foreground)}
.res-head>svg{flex:0 0 auto}
.res-title{font-size:14px;font-weight:600;color:var(--foreground)}
.res-sub{font-size:12.5px;color:var(--muted-foreground)}
.res-body{position:relative}
.res-code{max-height:360px;overflow:auto}
.res-head .grow{flex:1}
/* results histogram */
/* report artifact — rendered as an isolated HTML document */
.report-frame{display:block;width:100%;height:100%;min-height:100%;border:0;background:var(--canvas)}
.hist-wrap{padding:14px 16px;box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:stretch;justify-content:center}
.hist-wrap>svg{flex:0 0 auto}
.hist-bar{fill:#2bb6bf;transform-box:fill-box;transform-origin:bottom;animation:barGrow .5s cubic-bezier(.2,0,0,1) both;transition:fill .12s}
.hist-bar:hover{fill:#5be0e6}
.hist-y{fill:var(--muted-foreground);font-size:11px}
.hist-x{fill:var(--muted-foreground);font-size:10px;font-family:'JetBrains Mono',monospace}
/* ===== "5 results" artifact ===== */
/* charts */
.chart-wrap{padding:14px 16px 8px;box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.chart-wrap>svg{flex:0 0 auto;max-width:100%}
.chart-plot{position:relative;width:100%;min-width:0}
.chart-plot>svg{display:block;max-width:100%}
.chart-wrap.fill{flex:1 1 auto;min-height:0;padding-bottom:6px}
.chart-wrap.fill .chart-plot{flex:1 1 auto;min-height:0}
.chart-wrap.scroll-x .chart-plot{overflow-x:auto}
.chart-wrap.scroll-x .chart-plot>svg{max-width:none}
.chart-ylab{font-size:11.5px;color:var(--muted-foreground);margin:0 0 6px 2px}
.chart-xlab{font-size:11.5px;color:var(--muted-foreground);text-align:center;margin-top:2px}
.hist-x2{fill:var(--muted-foreground);font-size:11px;font-family:'JetBrains Mono',monospace}
.hist-x3{fill:var(--muted-foreground);font-size:9.5px;font-family:'JetBrains Mono',monospace}
.area-fill{fill:#2ec9d6;opacity:.12}
.zero-line{stroke:var(--border-strong);stroke-width:1;stroke-dasharray:3 3}
.sv-bar{transform-box:fill-box;transform-origin:bottom;animation:barGrow .5s cubic-bezier(.2,0,0,1) both;transition:opacity .12s}
.sv-bar:hover{opacity:.82}
.sv-chart-row{display:flex;align-items:flex-start;gap:8px;min-width:0}
.sv-chart-row .chart-wrap{flex:1 1 auto;min-width:0}
.phase-wheel{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 10px 4px 2px}
.pw-tick{fill:var(--muted-foreground);font-size:9px;font-family:'JetBrains Mono',monospace}
.pw-cap{font-size:10.5px;color:var(--muted-foreground)}
/* scalar hero */
.scalar-hero{padding:34px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.scalar-hero .sh-formula{font-size:14px;color:var(--muted-foreground);font-family:'JetBrains Mono',monospace}
.scalar-hero .sh-main{display:flex;align-items:baseline;gap:10px}
.scalar-hero .sh-big{font-size:56px;line-height:1;font-weight:600;letter-spacing:-.02em;color:#5be0e6;font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace}
.scalar-hero .sh-pm{font-size:18px;color:var(--muted-foreground);font-family:'JetBrains Mono',monospace}
.scalar-hero .sh-stats{display:flex;gap:36px;margin-top:14px}
.scalar-hero .sh-stat{display:flex;flex-direction:column;gap:3px}
.scalar-hero .sh-stat-l{font-size:11.5px;color:var(--muted-foreground)}
.scalar-hero .sh-stat-v{font-size:15px;font-weight:600;color:var(--foreground)}
/* stat cards */
.stat-grid{display:grid;gap:10px}
.stat-card{border:1px solid var(--border);border-radius:12px;background:var(--card);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat-card-l{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-foreground)}
.stat-card-v{font-size:26px;font-weight:600;letter-spacing:-.01em;color:var(--foreground);font-variant-numeric:tabular-nums;font-family:'JetBrains Mono',monospace;overflow:hidden;text-overflow:ellipsis}
.stat-card-v.tone-accent{color:#5be0e6}
/* data table */
.dtable-wrap{display:flex;flex-direction:column;gap:8px}
.dtable-bar{display:flex;align-items:center;gap:8px;padding:0 2px}
.dtable-bar .grow{flex:1}
.dtable-count{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.dtable-pager{display:inline-flex;gap:2px}
.dtable-scroll{overflow-x:hidden;border:1px solid var(--border);border-radius:12px}
.dtable{width:100%;table-layout:auto;border-collapse:separate;border-spacing:0;font-size:13px}
.dtable th{text-align:left;background:var(--secondary);color:var(--muted-foreground);font-weight:500;font-size:12.5px;
  padding:9px 14px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
.dtable th:hover{color:var(--foreground)}
.dtable .th-in{display:inline-flex;align-items:center;gap:5px}
.dtable td{padding:8px 14px;border-bottom:1px solid var(--border);color:var(--foreground);white-space:normal;overflow-wrap:anywhere}
.dtable td.num,.dtable td.mono{white-space:nowrap}
.dtable tbody tr:last-child td{border-bottom:0}
.dtable td.mono,.dtable th.mono{font-family:'JetBrains Mono',monospace}
.dtable td.num,.dtable th.num{text-align:right;font-variant-numeric:tabular-nums}
.dtable tbody tr{transition:background .1s}
.dtable tbody tr:hover{background:var(--accent)}
.dtable .sort-ind{color:var(--muted-foreground)}
.dtable td.cell-pos{color:#7ee2a8}
.dtable td.cell-neg{color:#ff8f8f}
.light .dtable td.cell-pos{color:#15803d}
.light .dtable td.cell-neg{color:#dc2626}
/* full-page result shell */
.r5-main{padding:20px 24px 44px;display:flex;flex-direction:column;gap:28px}
/* page header group: kicker → status */
.rf-header{display:flex;flex-direction:column;gap:6px}
.rf-eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-foreground)}
.rf-running{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-foreground)}
.rf-running::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;flex:0 0 auto}
/* section = a clear H2: sentence case, foreground, larger + heavier than the labels below it */
.rf-section{display:flex;flex-direction:column;gap:12px}
.rf-title{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--foreground);margin-left:16px}
.rf-card{border:0;border-radius:0;background:transparent;padding:8px}
/* results-pane picker (compact Select) */
.res-picker{min-width:0;max-width:240px}
.res-picker .field-select{position:relative}
.res-picker .select{height:28px;padding:0 30px 0 10px;font-size:12.5px;border-radius:7px}
/* dropdown grows leftward from the right edge so it never overflows the pane, and never wraps */
.res-picker .sel-menu{left:auto;right:0;width:max-content;min-width:100%;max-width:360px}
.res-picker .sel-opt{white-space:nowrap}
/* glimpse in split pane */
.glimpse{height:100%;min-height:0;padding:4px 6px;display:flex;flex-direction:column;box-sizing:border-box}
.glimpse>.chart-wrap{flex:1 1 auto;min-height:0}
.glimpse>.sv-chart-row{flex:1 1 auto;min-height:0}
.sv-chart-row.sv-fill{align-items:stretch}
.sv-chart-row.sv-fill .chart-wrap{min-height:0}
.glimpse.glimpse-center{align-items:center;justify-content:center}
/* mosaic workspace */
.mosaic{height:100%;min-height:0;display:flex;flex-direction:column}
.mosaic-area{flex:1;min-height:0;position:relative}
/* layout action sheet */
.lay-menu{min-width:236px}
.lay-item{display:flex;align-items:center;gap:11px}
.lay-item-ic{display:inline-flex;flex:0 0 auto;color:var(--muted-foreground)}
.lay-item.active .lay-item-ic{color:var(--foreground)}
.lay-item-name{flex:1;font-size:13.5px}
.lay-item.active{background:var(--accent)}
.lay-item-check{display:inline-flex;color:var(--foreground)}
.msplit{display:flex;width:100%;height:100%;min-width:0;min-height:0}
.msplit.row{flex-direction:row}
.msplit.col{flex-direction:column}
.msplit.rzing *{pointer-events:none}
.mpane-wrap{display:flex;min-width:0;min-height:0;overflow:hidden}
.mpane-wrap>*{flex:1 1 0;min-width:0;min-height:0}
.msplit.rzing .vresizer::before,.msplit.rzing .hresizer::before{background:var(--primary)}
.hresizer{flex:0 0 auto;width:10px;margin:0 -5px;position:relative;z-index:20;cursor:col-resize;
  display:flex;align-items:center;justify-content:center;background:transparent}
.hresizer::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:1px;background:var(--border);transition:background .12s}
.hresizer:hover::before,.hresizer:focus-visible::before{background:var(--primary)}
.hresizer .vgrip2{width:6px;height:34px;border-radius:9999px;background:var(--border-strong);opacity:0;transition:opacity .12s}
.hresizer:hover .vgrip2,.hresizer:focus-visible .vgrip2{opacity:1}
.hresizer:focus-visible{outline:none}
/* fullscreen container overlay */
.fs-overlay{position:fixed;inset:0;z-index:95;display:flex;flex-direction:column;background:var(--canvas);
  animation:scrimIn .16s ease both}
.fs-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:52px;padding:0 12px 0 16px;
  border-bottom:1px solid var(--border);background:var(--background)}
.fs-head .grow{flex:1}
.fs-head .btn.active{background:var(--accent);color:var(--foreground)}
.fs-title{font-size:14px;font-weight:600;color:var(--foreground)}
/* two-line header (result full pages): bold title + status subtitle */
.fs-head-block{display:flex;flex-direction:column;gap:2px;line-height:1.15}
.fs-head-title2{font-size:19px;font-weight:700;letter-spacing:-.01em;color:var(--foreground)}
.fs-head-sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted-foreground)}
.fs-head-sub::before{content:"";width:6px;height:6px;border-radius:50%;background:#22c55e;flex:0 0 auto}
.fs-body{flex:1;min-height:0;display:flex;overflow:hidden}
.fs-stage{flex:1;min-width:0;overflow:auto;position:relative}
.fs-scale{will-change:transform}
/* fullscreen circuit — collapsible details side panel */
.fs-info{flex:0 0 340px;width:340px;min-height:0;overflow:hidden;display:flex;flex-direction:column;
  background:var(--popover);border-left:1px solid var(--border);animation:msgIn .16s cubic-bezier(.2,0,0,1) both}
.ip-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:12px 10px 11px 16px;border-bottom:1px solid var(--border)}
.ip-head .ip-title{flex:1;font-size:14px;font-weight:600;color:var(--foreground)}
.ip-collapse{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;border:0;
  background:transparent;color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s}
.ip-collapse:hover{background:var(--accent);color:var(--foreground)}
.ip-tabs{flex:0 0 auto;display:flex;border-bottom:1px solid var(--border)}
.ip-tab{flex:1;height:40px;border:0;background:transparent;color:var(--muted-foreground);font:inherit;font-size:13.5px;
  cursor:pointer;border-bottom:2px solid transparent;transition:color .12s,border-color .12s,background .12s}
.ip-tab:hover{color:var(--foreground)}
.ip-tab.active{color:var(--foreground);border-bottom-color:var(--primary);background:var(--accent)}
.ip-body{flex:1;min-height:0;overflow-y:auto;padding:16px;font-size:13.5px;line-height:1.5}
.ip-row{margin:0 0 6px}
.ip-k{color:var(--muted-foreground)}
.ip-v{color:var(--foreground)}
.ip-h{font-size:15px;font-weight:600;color:var(--foreground);margin:20px 0 9px}
.ip-h:first-child{margin-top:0}
.ip-gate{margin:0 0 5px}
.ip-gk{color:var(--muted-foreground)}
.ip-gv{color:var(--foreground)}
.ip-kv{margin:0 0 7px}
.ip-mono{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--foreground);word-break:break-all}
/* collapsed state — a slim rail that re-opens the panel */
.fs-info-rail{flex:0 0 auto;width:42px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:12px 0;
  background:var(--popover);border:0;border-left:1px solid var(--border);color:var(--muted-foreground);cursor:pointer;
  transition:color .12s,background .12s;animation:msgIn .16s cubic-bezier(.2,0,0,1) both}
.fs-info-rail:hover{color:var(--foreground);background:var(--accent)}
.fs-info-rail .rail-label{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12.5px;font-weight:500;
  letter-spacing:.01em;margin-top:2px}
/* floating action panel in fullscreen */
.fs-toolbar{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:5px;
  padding:6px;border-radius:12px;background:var(--popover);border:1px solid var(--border);box-shadow:0 12px 32px rgba(0,0,0,.45)}
.fs-tb-btn,.fs-tb-icon,.fs-tb-sep,.fs-tb-pct{flex:0 0 auto}
.light .fs-toolbar{box-shadow:0 12px 32px rgba(15,23,42,.16)}
.fs-tb-btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:8px;border:0;background:transparent;
  color:var(--foreground);font:inherit;font-size:13.5px;cursor:pointer;transition:background .12s}
.fs-tb-btn:hover,.fs-tb-btn.active{background:var(--accent)}
.fs-tb-icon{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:8px;border:0;
  background:transparent;color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s}
.fs-tb-icon:hover,.fs-tb-icon.active{background:var(--accent);color:var(--foreground)}
.fs-tb-pct{min-width:40px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted-foreground)}
.fs-tb-sep{width:1px;height:22px;background:var(--border);margin:0 3px}
/* toggle switch (Variables View) */
.fs-tb-toggle{display:inline-flex;align-items:center;gap:9px;height:34px;padding:0 12px 0 10px;border-radius:8px;border:0;
  background:transparent;color:var(--foreground);font:inherit;font-size:13.5px;cursor:pointer;transition:background .12s}
.fs-tb-toggle:hover{background:var(--accent)}
.fs-sw{position:relative;flex:0 0 auto;width:34px;height:20px;border-radius:999px;background:var(--border-strong);
  transition:background .16s ease}
.fs-sw.on{background:var(--primary)}
.fs-sw-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.35);transition:transform .16s cubic-bezier(.2,0,0,1)}
.fs-sw.on .fs-sw-knob{transform:translateX(14px)}
/* fullscreen results — jobs history + histogram */
.rfull{display:flex;height:100%;min-height:0}
.jobs-hist{flex:0 0 320px;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--border);overflow:hidden}
.jh-head{flex:0 0 auto;padding:11px 16px 9px;font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--foreground)}
.jh-list{flex:1;min-height:0;overflow-y:auto;padding:4px 0}
.jh-item{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 12px;border:0;background:transparent;
  color:var(--foreground);font:inherit;font-size:13.5px;cursor:pointer;text-align:left}
.jh-item:hover,.jh-item.active{background:var(--accent)}
.jh-item>svg:first-child{color:var(--muted-foreground);flex:0 0 auto}
.jh-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jh-date{font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums;flex:0 0 auto}
.jh-acts{display:inline-flex;gap:8px;flex:0 0 auto}
.jh-act{display:inline-flex;color:var(--muted-foreground);cursor:pointer}
.jh-act:hover{color:var(--foreground)}
.jh-st{width:18px;height:18px;border-radius:9999px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto}
.jh-st.done{background:#22c55e}
.jh-st.error{background:#ef4444}
.jh-st.pending{background:#f59e0b}
.jh-detail{padding:10px 16px 14px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:6px}
.jh-dl{font-size:12px;line-height:1.4}
.jh-dk{color:var(--muted-foreground)}
.jh-dv{color:var(--foreground)}
.jh-dv.link{text-decoration:underline;cursor:pointer}
.jh-dv.ok{color:#7ee2a8}
.light .jh-dv.ok{color:#15803d}
.rfull-main{flex:1;min-width:0;min-height:0;overflow:auto;padding:8px}

/* synthesize split button */
.split-btn{display:inline-flex;align-items:stretch;height:30px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--primary)}
.split-btn button{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--primary-foreground);
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:background .12s}
.split-btn .sb-main{padding:0 12px}
.split-btn .sb-chev{padding:0 7px}
.split-btn button:hover{background:color-mix(in srgb,var(--primary) 88%,#000)}
.split-btn .sb-sep{width:1px;flex:0 0 auto;background:color-mix(in srgb,var(--primary-foreground) 28%,transparent)}

/* right synthesis drawer (Sheet not in kit — recomposed) */
.drawer-scrim{position:fixed;inset:0;z-index:96;display:flex;justify-content:flex-end;background:rgba(15,15,17,.5);animation:scrimIn .16s ease both}
.light .drawer-scrim{background:rgba(38,38,38,.28)}
.drawer{width:min(400px,92vw);height:100%;display:flex;flex-direction:column;background:var(--background);
  border-left:1px solid var(--border);box-shadow:-16px 0 40px rgba(0,0,0,.3);animation:drawerIn .24s cubic-bezier(.2,0,0,1) both}
.light .drawer{box-shadow:-16px 0 40px rgba(15,23,42,.12)}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes drawerOut{from{transform:none}to{transform:translateX(100%)}}
@keyframes scrimOut{from{opacity:1}to{opacity:0}}
.drawer-scrim.closing{animation:scrimOut .2s ease both}
.drawer.closing{animation:drawerOut .24s cubic-bezier(.2,0,0,1) both}
.drawer-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:52px;padding:0 10px 0 18px;border-bottom:1px solid var(--border)}
.drawer-title{flex:1;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted-foreground)}
.drawer-body{flex:1;min-height:0;overflow-y:auto;padding:4px 18px 20px}
.drawer-foot{flex:0 0 auto;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:14px 18px;border-top:1px solid var(--border)}
.drawer-group{padding:6px 0}
.drawer-group-head{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:0;color:var(--foreground);
  font:inherit;font-size:15px;font-weight:600;padding:10px 0;cursor:pointer;text-align:left}
.drawer-group-head .gh-ic{display:inline-flex;color:var(--muted-foreground);transition:transform .16s ease}
.drawer-fields{display:flex;flex-direction:column;gap:16px;padding:4px 0 6px}
.field-v{display:flex;flex-direction:column;gap:7px}
.field-v>label{font-size:13px;color:var(--muted-foreground)}
.field-v .input{width:100%}
.field-select{position:relative}
.select{display:flex;align-items:center;text-align:left;width:100%;height:36px;padding:0 34px 0 12px;border-radius:8px;
  border:1px solid var(--input);background:var(--background);color:var(--foreground);font:inherit;font-size:14px;cursor:pointer;
  box-shadow:0 1px 2px rgba(0,0,0,.06);outline:none;transition:border-color .12s,box-shadow .12s}
.select:hover{border-color:var(--border-strong)}
.select.open,.select:focus-visible{border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in srgb,var(--ring) 25%,transparent)}
.sel-val{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sel-val.ph{color:var(--muted-foreground)}
.sel-chev{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted-foreground);display:inline-flex}
.sel-menu{position:absolute;top:calc(100% + 6px);left:0;width:100%;z-index:80;max-height:240px;overflow-y:auto;
  background:var(--popover);color:var(--popover-foreground);border:1px solid var(--border);border-radius:10px;padding:6px;
  box-shadow:0 12px 32px rgba(0,0,0,.45);animation:msgIn .14s cubic-bezier(.2,0,0,1) both}
.light .sel-menu{box-shadow:0 12px 32px rgba(15,23,42,.16)}
.sel-opt{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:6px 8px;border:0;border-radius:7px;
  background:transparent;color:var(--foreground);font:inherit;font-size:14px;cursor:pointer;text-align:left}
.sel-opt:hover,.sel-opt.active{background:var(--accent)}
.sel-opt-check{width:16px;flex:0 0 auto;display:inline-flex;color:var(--foreground)}
/* execution drawer + qmod flow */
.chk-group{display:flex;flex-direction:column;gap:11px}
.chk-row{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--foreground);cursor:pointer}
.drawer-group-title{font-size:15px;font-weight:600;padding:8px 0 2px}
.exec-summary{border:1px solid var(--border);border-radius:10px;background:var(--card);padding:12px 14px}
.es-title{font-size:13.5px;font-weight:500}
.es-sub{font-size:12.5px;color:var(--muted-foreground);margin-top:4px}
.split-btn.disabled{opacity:.5;pointer-events:none}
/* secondary state — de-emphasised once the primary action moves downstream */
.split-btn.secondary{background:var(--secondary);border:1px solid var(--border)}
.split-btn.secondary button{color:var(--secondary-foreground)}
.split-btn.secondary button:hover{background:var(--accent)}
.split-btn.secondary .sb-sep{background:color-mix(in srgb,var(--secondary-foreground) 20%,transparent)}
.qflow-area{height:100%;display:flex;min-height:0}
.qflow-area>*{flex:1 1 0;min-width:0;min-height:0}
.qflow-loader{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;gap:12px;
  background:color-mix(in srgb,var(--canvas) 72%,transparent);backdrop-filter:blur(1px);font-size:14px;color:var(--foreground)}
/* toast (shadcn-style, bottom-left, success green) */
.toast{position:fixed;left:20px;bottom:20px;z-index:100;display:flex;align-items:flex-start;gap:10px;width:340px;max-width:calc(100vw - 40px);
  padding:12px 12px 12px 14px;border-radius:12px;background:var(--popover);color:var(--popover-foreground);
  border:1px solid color-mix(in srgb,#22c55e 45%,var(--border));border-left:3px solid #22c55e;
  box-shadow:0 12px 32px rgba(0,0,0,.4);animation:toastIn .22s cubic-bezier(.2,0,0,1) both}
.light .toast{box-shadow:0 12px 32px rgba(15,23,42,.16)}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast-ic{display:inline-flex;flex:0 0 auto;color:#22c55e;margin-top:1px}
.toast-body{flex:1;min-width:0}
.toast-title{font-size:14px;font-weight:600}
.toast-desc{font-size:13px;color:var(--muted-foreground);margin-top:2px;line-height:1.4}
.toast-x{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;border-radius:6px;
  background:transparent;color:var(--muted-foreground);cursor:pointer;transition:background .12s,color .12s}
.toast-x:hover{background:var(--accent);color:var(--foreground)}
.jobs-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jobs-toolbar .grow{flex:1}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--secondary);border:1px solid var(--border)}
.seg-btn{height:28px;padding:0 12px;border-radius:8px;border:0;background:transparent;color:var(--muted-foreground);
  font:inherit;font-size:13px;cursor:pointer;transition:background .12s,color .12s}
.seg-btn:hover{color:var(--foreground)}
.seg-btn.active{background:var(--background);color:var(--foreground);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.jtable{border:1px solid var(--border);border-radius:12px;overflow:hidden;animation:cardIn .5s cubic-bezier(.2,0,0,1) both;animation-delay:.12s}
.jrow{display:grid;grid-template-columns:minmax(0,1fr) 150px 96px 130px 52px 52px 40px;align-items:center;gap:8px;
  padding:0 12px;height:52px;border-bottom:1px solid var(--border);font-size:13.5px}
.jrow:last-child{border-bottom:0}
.jrow.head{height:44px;background:var(--secondary);color:var(--muted-foreground);font-size:12.5px;font-weight:500}
.jrow.body{animation:rowIn .5s ease both}
.jrow.body:hover{background:var(--accent)}
.jname{display:flex;align-items:center;gap:10px;min-width:0}
.jname .jn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;font-size:13px}
.jgrip{color:var(--muted-foreground);display:flex;flex:0 0 auto;opacity:.55;cursor:grab}
.jcheck{width:16px;height:16px;accent-color:var(--primary);cursor:pointer;flex:0 0 auto}
.jcell-mono{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--muted-foreground)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.badge-run{background:color-mix(in srgb,#5be0e6 18%,transparent);color:#7fe3dd;border-color:color-mix(in srgb,#5be0e6 30%,transparent)}
.light .badge-run{color:#0e7490}
/* light mode: swap the heavy dark drop-shadows on floating surfaces for soft light ones */
.light .tt>.tt-body{box-shadow:0 6px 20px rgba(15,23,42,.12)}
.light .menu{box-shadow:0 10px 30px rgba(15,23,42,.14)}
.light .switcher-pop{box-shadow:0 12px 32px rgba(15,23,42,.14)}
.canvas-body{flex:1;min-height:0;overflow:auto;position:relative}
.code{font-family:'JetBrains Mono',monospace;font-size:12.5px;line-height:1.62;min-height:100%;padding:14px 0}
.codeline{display:flex;align-items:flex-start}
.cl-num{flex:0 0 auto;width:54px;padding-right:16px;text-align:right;user-select:none;
  color:color-mix(in srgb,var(--muted-foreground) 70%,transparent)}
.cl-txt{flex:1 1 auto;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.code-scroll,.codelines{padding-right:16px}
.tok-kw{color:#c586e0}.tok-str{color:#e6c07b}.tok-com{color:#6a7a55}.tok-num{color:#7fd6ff}.tok-fn{color:#7fd6ff}
.light .tok-kw{color:#a626a4}.light .tok-str{color:#b8860b}.light .tok-com{color:#5a8f3c}.light .tok-num{color:#0184bc}.light .tok-fn{color:#0184bc}

/* circuit — Classiq QP visualization (exported raster) */
.circuit-scroll{padding:26px;min-height:100%;display:flex;align-items:center;justify-content:center}
.qp-frame{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#0d0d0f;
  box-shadow:0 8px 30px rgba(0,0,0,.35);max-width:100%}
.light .qp-frame{border-color:var(--border-strong);background:#e4e4e4;box-shadow:0 4px 18px rgba(0,0,0,.08)}
.qp-img{display:block;width:100%;height:auto;max-width:1368px}
.qp-collapsed{width:100%;max-width:1368px;padding:22px 26px;background:#0d0d0f}
.light .qp-collapsed{background:#e9e9ea}
.qp-collapsed svg{display:block;width:100%;height:auto}
/* swap the raster by theme (light variant recolored from the export) */
.qp-img.qp-light{display:none}
.light .qp-img.qp-dark{display:none}
.light .qp-img.qp-light{display:block}

/* vertical split canvas — code above, visualization below (adjustable) */
.canvas-vsplit{flex:1;min-height:0;display:flex;flex-direction:column}
.canvas-body>.canvas-vsplit{height:100%}
.canvas-vsplit.resizing{cursor:row-resize;user-select:none}
.canvas-vsplit.resizing *{pointer-events:none}
.vpane{display:flex;flex-direction:column;min-height:0;overflow:hidden}
.vpane-head{flex:0 0 auto;display:flex;align-items:center;gap:8px;height:38px;padding:0 8px 0 12px;
  border-bottom:1px solid var(--border);color:var(--muted-foreground);font-size:12.5px}
.vpane-head .grow{flex:1}
.vpane-head>svg:first-child{color:var(--muted-foreground);flex:0 0 auto}
.vpane-head .vpane-label{color:var(--foreground);font-weight:500}
.vpane-body{flex:1;min-height:0;overflow:auto;position:relative}
.vpane-body .circuit-scroll{padding:18px}
.vresizer{flex:0 0 auto;height:10px;margin:-5px 0;position:relative;z-index:20;cursor:row-resize;
  display:flex;align-items:center;justify-content:center;background:transparent}
.vresizer::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--border);transition:background .12s}
.vresizer:hover::before,.vresizer:focus-visible::before,.canvas-vsplit.resizing .vresizer::before{background:var(--primary)}
.vresizer .vgrip{width:34px;height:6px;border-radius:9999px;background:var(--border-strong);opacity:0;transition:opacity .12s;z-index:1}
.vresizer:hover .vgrip,.vresizer:focus-visible .vgrip{opacity:1}
.vresizer:focus-visible{outline:none}

/* empty */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:40px;text-align:center}
.empty .em-media{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:var(--secondary);color:var(--muted-foreground)}
.empty .em-title{font-size:15px;font-weight:600}
.empty .em-desc{font-size:13px;color:var(--muted-foreground);max-width:280px}

/* quick-reply chips inside a chat message */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
/* problem-framing chat */
.frame-step{font-size:12px;color:var(--muted-foreground);letter-spacing:.02em}
.frame-hint{font-size:12px;color:var(--muted-foreground);margin:10px 0 0}
.frame-recap{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden}
.frame-recap .recap-row{display:flex;gap:12px;padding:9px 12px;font-size:13.5px}
.frame-recap .recap-row+.recap-row{border-top:1px solid var(--border)}
.frame-recap .recap-k{flex:0 0 92px;color:var(--muted-foreground)}
.frame-recap .recap-v{flex:1;color:var(--foreground);font-weight:500}
/* action item card (e.g. Synthesize) */
.action-card{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:12px;
  border:1px solid var(--border);background:var(--card)}
.action-card .item-media{flex:0 0 auto}
.action-card .item-content{flex:1;min-width:0}
.action-card .btn{flex:0 0 auto}
/* suggestion chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
/* start option cards (empty state) */
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%;max-width:860px;margin-top:4px}
.option-card{display:flex;align-items:flex-start;gap:12px;text-align:left;padding:16px;border-radius:14px;
  border:1px solid var(--border);background:var(--card);color:var(--foreground);cursor:pointer;
  transition:border-color .14s,background .14s,transform .14s,box-shadow .14s}
.option-card:hover{background:var(--accent);border-color:var(--border-strong);transform:translateY(-1px)}
.option-card.primary{border-color:var(--primary);box-shadow:0 0 0 1px var(--primary)}

@keyframes cqMenuIn{from{opacity:.001;transform:translateX(-108%)}to{opacity:1;transform:none}}
@keyframes cqBarIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){

}

/* ---- sortable / paginated DataFrame table with CSV ---- */
function DataTable({columns,rows,pageSize,csvName,defaultSort}){
  const [sort,setSort]=useState(defaultSort||{key:columns[0].key,dir:'desc'});
  const [page,setPage]=useState(0);
  const ps=pageSize||100;
  const sorted=rows.slice().sort((a,b)=>{const av=a[sort.key],bv=b[sort.key];
    const num=(typeof av==='number'&&typeof bv==='number');
    const c=num?av-bv:String(av).localeCompare(String(bv));return sort.dir==='asc'?c:-c;});
  const total=sorted.length,pages=Math.max(1,Math.ceil(total/ps)),p=Math.min(page,pages-1);
  const shown=sorted.slice(p*ps,p*ps+ps);
  const from=total?p*ps+1:0,to=Math.min(total,p*ps+ps);
  const clickKey=(k,sortable)=>{if(sortable===false)return;
    setSort(s=>s.key===k?{key:k,dir:s.dir==='asc'?'desc':'asc'}:{key:k,dir:'desc'});};
  const th=(col)=>_c('th',{key:col.key,scope:'col',className:cx(col.mono&&'mono',col.num&&'num'),
    'aria-sort':sort.key===col.key?(sort.dir==='asc'?'ascending':'descending'):'none',
    onClick:()=>clickKey(col.key,col.sortable),style:col.sortable===false?null:{cursor:'pointer'}},
    _c('span',{className:'th-in'},col.label,(col.sortable!==false&&sort.key===col.key)&&
      _c('span',{className:'sort-ind',style:{display:'inline-flex',transform:sort.dir==='asc'?'rotate(180deg)':'none'}},IcChevD({s:12}))));
  const td=(col,r)=>_c('td',{key:col.key,className:cx(col.mono&&'mono',col.num&&'num',col.tone&&col.tone(r[col.key]))},
    col.fmt?col.fmt(r[col.key],r):r[col.key]);
  const header=_c('thead',null,_c('tr',null,columns.map(th)));
  const body=shown.map((r,i)=>_c('tr',{key:i},columns.map(col=>td(col,r))));
  return _c('div',{className:'dtable-wrap'},
    _c('div',{className:'dtable-bar'},
      _c('span',{className:'dtable-count'},'Rows per page: '+ps+'    '+from+'–'+to+' of '+total),
      _c('div',{className:'grow'}),
      pages>1&&_c('span',{className:'dtable-pager'},
        _c(Button,{icon:true,size:'sm',variant:'ghost','aria-label':'Previous page',onClick:()=>setPage(v=>Math.max(0,v-1))},IcChevL({s:16})),
        _c(Button,{icon:true,size:'sm',variant:'ghost','aria-label':'Next page',onClick:()=>setPage(v=>Math.min(pages-1,v+1))},IcChevR({s:16}))),
      _c(Tooltip,{label:'Download CSV'},_c(Button,{icon:true,size:'sm',variant:'ghost','aria-label':'Download CSV',

}
